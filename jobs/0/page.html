const NV_C = { base: 0x050506, android: 0x3DDC84, kotlin: 0x7F52FF, flutter: 0x54C5F8, flutterDeep: 0x027DFD,

// ---- world: obsidian void, glossy dark titanium floor with soft real reflections, haze, fine dust
function nvWorld(o = {}) {
  const s = K.stage({ bg: '#050506', fov: o.fov ?? 30, cam: o.cam, target: o.target, floor: false,
    fogNear: o.fogNear ?? 8, fogFar: o.fogFar ?? 28, bloomStrength: o.bloom ?? 0.3, env: o.env ?? 0.55,
    key: 2.1, keyPos: [-6, 9, 5], front: 0.35, rim: 1.25, rimColor: NV_C.cool, shadowBox: o.shadowBox ?? 8 });
  const c = o.center ?? [0, 0, 0];
  s.lights.key.position.set(c[0] - 6, 9, c[2] + 5);           // softbox top-left, shadows fall back-right
  s.lights.key.target.position.set(...c);
  s.lights.rim.position.set(c[0] + 6, 4, c[2] - 7);
  s.lights.rim.target.position.set(...c);
  s.scene.add(s.lights.key.target, s.lights.rim.target);
  const mirror = new Reflector(new THREE.PlaneGeometry(240, 240), {
    textureWidth: 960, textureHeight: 540, color: 0x8a8a8a, multisample: 0 });
  mirror.rotation.x = -Math.PI / 2;
  mirror.position.y = -0.004;
  const skin = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({   // no specular sheet: gloss comes from the mirror
    color: 0x050506, transparent: true, opacity: o.gloss ?? 0.74 }));
  skin.rotation.x = -Math.PI / 2;
  skin.receiveShadow = true;
  s.scene.add(mirror, skin);
  const dusts = (o.dust ?? [[...c, 30]]).map(([x, y, z, sp], i) => {
    const d = K.dust({ count: 360, spread: [sp, 6, sp], color: 0xdfe3ea, size: 0.018, opacity: 0.3, seed: 11 + i });
    d.points.position.set(x, y, z);
    s.scene.add(d.points);

  });
  for (const [x, y, z, r, a] of o.haze ?? []) s.scene.add(nvSprite(0xb4bfd0, r, a, [x, y, z]));
  return { s, update(t) { for (const d of dusts) d.update(t); } };

let nvRadialTex = null;
function nvRadial() {
  return nvRadialTex ??= nvCanvasTex(256, 256, g => {
    const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,255,255,.42)');
    r.addColorStop(0.65, 'rgba(255,255,255,.1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  });
}
function nvSprite(color, size, opacity, pos) {      // soft light (halo / haze), always faces the camera
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: nvRadial(), color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  sp.scale.set(size, size, 1);
  if (pos) sp.position.set(...pos);
  sp.userData.op = opacity;
  return sp;
}
function nvPool(color, r, opacity, pos) {           // soft light pool on the floor
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2), new THREE.MeshBasicMaterial({ map: nvRadial(), color,
    transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(pos[0], 0.004, pos[2]);
  m.userData.op = opacity;

}
function nvCanvasTex(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;

// ---- camera: one continuous path. keys [t, x,y,z, tx,ty,tz, viewOffsetPx]; cubic Hermite with Catmull-Rom tangents
// over real time (non-uniform), so the camera never stops between keys.
function nvPath(keys) {
  const n = keys.length;
  const tan = keys.map((k, i) => {
    const a = keys[Math.max(i - 1, 0)], b = keys[Math.min(i + 1, n - 1)], dt = (b[0] - a[0]) || 1;
    return k.map((_, j) => (j ? (b[j] - a[j]) / dt : 0));
  });
  return t => {
    if (t <= keys[0][0]) return keys[0].map((v, j) => v + tan[0][j] * (t - keys[0][0])).slice(1);
    if (t >= keys[n - 1][0]) return keys[n - 1].map((v, j) => v + tan[n - 1][j] * (t - keys[n - 1][0])).slice(1);
    let i = 0;
    while (i < n - 2 && t > keys[i + 1][0]) i++;
    const A = keys[i], B = keys[i + 1], h = B[0] - A[0], u = (t - A[0]) / h, u2 = u * u, u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
    return A.map((a, j) => h00 * a + h10 * h * tan[i][j] + h01 * B[j] + h11 * h * tan[i + 1][j]).slice(1);
  };
}
function nvApplyCam(s, c) {                          // c = [x,y,z, tx,ty,tz, off]
  s.camera.position.set(c[0], c[1], c[2]);
  s.target.set(c[3], c[4], c[5]);
  s.camera.setViewOffset(s.W, s.H, c[6] ?? 0, 0, s.W, s.H);   // + = scene shifts left on screen
  s.camera.updateProjectionMatrix();
  s.camera.lookAt(s.target);
  s.camera.updateMatrixWorld();
}
const nvV = new THREE.Vector3(), nvF = new THREE.Vector3();
function nvAt(s, c, sx, sy, dist) {                  // world point seen at screen px (sx, sy), `dist` along the view axis
  nvApplyCam(s, c);
  nvV.set(sx / s.W * 2 - 1, 1 - sy / s.H * 2, 0.5).unproject(s.camera).sub(s.camera.position).normalize();
  s.camera.getWorldDirection(nvF);
  return s.camera.position.clone().addScaledVector(nvV, dist / nvV.dot(nvF));
}
function nvPxPerUnit(s, dist) { return s.H / 2 / (Math.tan(THREE.MathUtils.degToRad(s.camera.fov / 2)) * dist); }

// ---- assets
async function nvImg(idOrUrl) {   // <link rel="ave-asset" id> or URL -> decoded Image (SVG gets an intrinsic size)
  const el = document.getElementById(idOrUrl), href = el ? (el.href || el.getAttribute('href')) : idOrUrl;
  let src = href;
  if (/\.svg(\?|#|$)/i.test(href)) {
    const txt = await new Promise(res => {
      try { const x = new XMLHttpRequest(); x.open('GET', href); x.onload = () => res(x.responseText || null); x.onerror = () => res(null); x.send(); }
      catch (e) { res(null); }
    });
    if (txt && /<svg/i.test(txt)) {
      const vb = /viewBox\s*=\s*["']\s*([-\d.]+)[\s,]+([-\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(txt);
      let svg = txt;
      if (vb) svg = svg.replace(/<svg([^>]*?)\s(width|height)\s*=\s*["'][^"']*["']/gi, '<svg$1')
        .replace(/<svg([^>]*?)\s(width|height)\s*=\s*["'][^"']*["']/gi, '<svg$1')
        .replace(/<svg/i, `<svg width="${vb[3] * 4}" height="${vb[4] * 4}"`);
      src = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    }
  }
  const im = new Image(); im.src = src;
  try { await im.decode(); } catch (e) { console.warn('nv: asset failed', href); return null; }

}
function nvCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function nvCropFirst(im, gapFrac = 0.03) {      // first content block from the left (logo mark without its wordmark)
  const W = im.naturalWidth, H = im.naturalHeight, [c, g] = nvCanvas(W, H);
  g.drawImage(im, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data, col = x => { for (let y = 0; y < H; y++) if (d[(y * W + x) * 4 + 3] > 8) return true; return false; };
  let x0 = 0; while (x0 < W && !col(x0)) x0++;
  let x1 = x0, gap = 0;
  for (let x = x0; x < W; x++) { if (col(x)) { x1 = x; gap = 0; } else if (++gap > W * gapFrac) break; }
  let y0 = H, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = x0; x <= x1; x++) if (d[(y * W + x) * 4 + 3] > 8) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); break; }
  const [o, og] = nvCanvas(x1 - x0 + 1, y1 - y0 + 1);
  og.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
function nvTint(src, color) {                     // single-colour logo (black SVG) -> silver
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, [c, g] = nvCanvas(w, h);
  g.drawImage(src, 0, 0, w, h); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, w, h);
  return c;

async function nvFonts() {
  const want = ['500 30px Inter', '600 30px Inter', '600 30px "Inter Tight"', '700 30px "Inter Tight"',
    '500 30px "Geist Mono"', '400 30px "Geist Mono"'];
  try { await Promise.race([Promise.all(want.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 6000))]); }
  catch (e) { /* system fallback */ }

const NV_F = (w, px) => `${w} ${px}px "Inter Tight", Inter, "Segoe UI", sans-serif`;
const NV_I = (w, px) => `${w} ${px}px Inter, "Segoe UI", sans-serif`;
const NV_M = (w, px) => `${w} ${px}px "Geist Mono", Consolas, monospace`;

// ---- materials (dark glass + titanium; kit has no titanium tone of its own)
function nvGlassMat() {
  return new THREE.MeshPhysicalMaterial({ color: 0x101114, metalness: 0.15, roughness: 0.16, clearcoat: 1,
    clearcoatRoughness: 0.05, envMapIntensity: 0.85 });
}
function nvTitaniumMat(rough = 0.34) {
  return new THREE.MeshPhysicalMaterial({ color: 0x8d8f94, metalness: 1, roughness: rough, clearcoat: 0.25,
    clearcoatRoughness: 0.3, envMapIntensity: 0.9 });
}

// ---- logo tile: dark-glass slab, real logo inlaid on the face, brand colour only as a soft light behind
function nvLogoTile(logo, o = {}) {
  const S = o.size ?? 1, d = o.depth ?? S * 0.17, g = new THREE.Group();
  const body = K.slab(S, S, { depth: d, radius: S * 0.23, material: o.material ?? nvGlassMat() });
  g.add(body);
  const R = 512, tex = nvCanvasTex(R, R, x => {
    const lw = logo.naturalWidth || logo.width, lh = logo.naturalHeight || logo.height, f = o.frac ?? 0.56;
    const sc = Math.min(R * f / lw, R * f / lh);
    x.drawImage(logo, (R - lw * sc) / 2, (R - lh * sc) / 2, lw * sc, lh * sc);
  });
  const dec = new THREE.Mesh(new THREE.PlaneGeometry(S, S), new THREE.MeshBasicMaterial({ map: tex, transparent: true,
    toneMapped: false, color: new THREE.Color(o.gain ?? 0.93, o.gain ?? 0.93, o.gain ?? 0.93), depthWrite: false }));
  dec.position.z = d / 2 + 0.002;
  g.add(dec);
  let halo = null;
  if (o.glow !== false) {
    halo = nvSprite(o.glow ?? NV_C.cool, S * 2.4, o.glowOp ?? 0.2, [0, 0, -d * 0.8]);

}
function nvFade(obj, k) {                          // opacity of a group's materials, base kept
  obj.visible = k > 0.002;
  obj.traverse(m => {
    if (!m.material) return;
    const mt = m.material;
    mt.userData.b ??= mt.opacity;
    mt.userData.tr ??= mt.transparent;
    mt.transparent = mt.userData.tr || k < 0.999;
    mt.opacity = mt.userData.b * k;
  });
}

// ---- HTML
function nvShow(el, k, rise = 16) {

// world-native-flutter · part A2 · world/phones.js   (contract: graphics_src/world/CONTRACT.md)
// Phones: Pixel-like Android (aluminium + matte glass + camera bar) and iPhone-like (titanium + camera bump).
// ACT 1: hero phoneA (slow turn, ghost iPhone flicker at 2.7), 5-layer exploded view from 4.87 (App UI · Kotlin code ·
// Android Studio · Android SDK/Jetpack · board), lights at 5.73 / 7.53 / 8.4 / 8.8, collapse 9.93 -> Swiggy splash,
// Kotlin badge stamp at 11.63. ACT 2: phoneL (Android) + phoneR (iPhone) rise at 17.33, one shared counter-app screen
// assembles 17.6-18.6, taps 19.2 / 19.9 (0 -> 1 -> 2 on both phones, same frame), Google Pay splash wipe at 20.43.
// Every frame is a pure function of t. No top-level import: THREE comes from K.THREE, so the joiner can inline this.

let PH_3 = null;   // THREE (set in PH_build)
let PH_K = null;   // kit

// ---------------------------------------------------------------- tunables (the joiner may tune these)
const PH_POS = { phoneA: [-1.4, 1.5, 0], phoneL: [37.6, 1.15, 0.6], phoneR: [39.6, 1.15, 0.6] };
const PH_T = {
  ghost: 2.7, explode: 4.87, collapse: 9.93, swiggy: 10.5, badge: 11.63, hideA: 14.6,
  rise: 17.33, taps: [19.2, 19.9], counts: [19.25, 19.95], gpay: 20.43,
};
const PH_GAP = 0.42;                        // exploded spacing between layers along the phone's local +Z
const PH_LIFT = 0.2;                        // board (layer5) height above the chassis front when exploded

const PH_TOE = 0.12;                        // ACT 2 phones turn in toward the centre (rad)

  { lit: null, a: '#FFFFFF', b: '#FFFFFF' },     // layer1 App UI (the screen itself, always on)
  { lit: 5.73, a: '#7F52FF', b: '#E44857' },     // layer2 Kotlin code
  { lit: 7.53, a: '#4285F4', b: '#3DDC84' },     // layer3 Android Studio
  { lit: 8.40, a: '#3DDC84', b: '#B6F5D0' },     // layer4 Android SDK · Jetpack

// ---------------------------------------------------------------- small math (pure)
const PH_cl = x => Math.min(Math.max(x, 0), 1);

async function PH_fonts() {

  const has = [...document.fonts].some(f => f.family.replace(/["']/g, '') === 'Inter Tight' && f.status === 'loaded');

    try {

      try { const x = new XMLHttpRequest(); x.open('GET', href); x.onload = () => res(x.responseText || null); x.onerror = () => res(null); x.send(); }
      catch (e) { res(null); }
    });

// ---------------------------------------------------------------- shaders
const PH_VS = `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
void main() { vUv = uv; vec4 wp = modelMatrix * vec4(position, 1.0); vN = normalize(mat3(modelMatrix) * normal);

const PH_FS_SCREEN = `uniform sampler2D tA, tB; uniform float uMix, uMode, uGain, uAsp; uniform vec4 uTap, uFab;
varying vec2 vUv; varying vec3 vN; varying vec3 vV;
float sdRB(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

    float R = 0.015 + 0.30 * (1.0 - pow(1.0 - clamp(age / 0.35, 0.0, 1.0), 2.0));
    float disc = 1.0 - smoothstep(R - 0.008, R, length(tp));

const PH_FS_FACE = `uniform sampler2D map; uniform float uLit, uLvl, uDim, uSweep, uSheen, uOp, uWave;

const PH_FS_PCB = `uniform sampler2D map, dmap; uniform float uLit, uDim, uTime, uSweep, uSheen; uniform vec3 uPulse;

void main() {

// ---------------------------------------------------------------- materials
function PH_mats() {

    backA: phys({ color: 0x56615b, metalness: 0, roughness: 0.42, clearcoat: 1, clearcoatRoughness: 0.2 }),
    backI: phys({ color: 0x8a867f, metalness: 0.05, roughness: 0.46, clearcoat: 1, clearcoatRoughness: 0.28 }),
    bumpI: phys({ color: 0x8f8b84, metalness: 0.05, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.06 }),
    inner: new T.MeshStandardMaterial({ color: 0x1c1e22, metalness: 0.6, roughness: 0.55 }),

    iris: new T.MeshBasicMaterial({ color: 0x0a1428 }),

// ---------------------------------------------------------------- phone model
function PH_dims(w, h, d, kind) {
  const ip = kind === 'iphone', r = (ip ? 0.15 : 0.16) * w, wall = 0.022 * w;
  const gw = w - 2 * wall + 0.004 * w, gh = h - 2 * wall + 0.004 * w, gr = r - wall + 0.002 * w, gd = 0.01 * w, b = 0.032 * w;
  return { w, h, d, r, wall, gw, gh, gr, gd, gz: d / 2 - 0.006 * w, b, sw: gw - 2 * b, sh: gh - 2 * b,
    sr: Math.max(gr - b, 0.01), e: (ip ? 0.0045 : 0.0095) * w };
}
function PH_lens(g, x, y, z, r, ringMat, M) {   // faces -Z (back)
  const T = PH_3;
  const ring = new T.Mesh(new T.TorusGeometry(r, r * 0.12, 12, 48), ringMat); ring.position.set(x, y, z - r * 0.05); g.add(ring);
  const gl = new T.Mesh(new T.CircleGeometry(r * 0.96, 40), M.lens); gl.position.set(x, y, z - r * 0.02); gl.rotation.y = Math.PI; g.add(gl);
  const ir = new T.Mesh(new T.CircleGeometry(r * 0.4, 32), M.iris); ir.position.set(x, y, z - r * 0.03); ir.rotation.y = Math.PI; g.add(ir);
}
function PH_chassis(K, kind, D, M) {   // frame rail + back glass + inner floor + buttons + camera
  const T = PH_3, g = new T.Group(), ip = kind === 'iphone', fm = ip ? M.ti : M.alu, w = D.w;
  const sh = PH_rrPath(new T.Shape(), D.w, D.h, D.r);
  sh.holes.push(PH_rrPath(new T.Path(), D.w - 2 * D.wall, D.h - 2 * D.wall, D.r - D.wall));
  const frame = new T.Mesh(PH_crease(PH_extrude(sh, D.d, D.e, ip ? 2 : 6), ip ? 0.6 : 0.95), fm);
  frame.castShadow = frame.receiveShadow = true; g.add(frame);
  const back = K.slab(D.gw, D.gh, { depth: 0.01 * w, radius: D.gr, material: ip ? M.backI : M.backA });
  back.position.z = -D.d / 2 + 0.006 * w; g.add(back);
  const floor = new T.Mesh(PH_rrGeo(D.gw - 0.004 * w, D.gh - 0.004 * w, D.gr - 0.002 * w), M.inner);
  floor.position.z = back.position.z + 0.0052 * w; g.add(floor);
  const btn = (x, y, len) => { const b = K.box(0.014 * w, len, D.d * 0.36, { radius: 0.004 * w, material: fm }); b.position.set(x, y, 0); g.add(b); };
  const R = D.w / 2 + 0.002 * w, L = -R;
  if (ip) { btn(R, 0.17 * D.h, 0.11 * D.h); btn(L, 0.28 * D.h, 0.045 * D.h); btn(L, 0.19 * D.h, 0.075 * D.h); btn(L, 0.095 * D.h, 0.075 * D.h); }
  else { btn(R, 0.20 * D.h, 0.075 * D.h); btn(R, 0.05 * D.h, 0.16 * D.h); }
  const bz = -D.d / 2;
  if (ip) {   // square camera bump, top-left seen from the back (= local +X)
    const s = 0.40 * w, cx = D.w / 2 - 0.05 * w - s / 2, cy = D.h / 2 - 0.05 * w - s / 2;
    const bump = K.slab(s, s, { depth: 0.016 * w, radius: 0.1 * w, material: M.bumpI }); bump.position.set(cx, cy, bz - 0.004 * w); g.add(bump);
    const z = bump.position.z - 0.008 * w;
    for (const [ox, oy] of [[0.095, 0.095], [0.095, -0.095], [-0.085, 0]]) {
      const r = 0.078 * w, hs = new T.Mesh(new T.CylinderGeometry(r, r, 0.014 * w, 48), M.ti);
      hs.rotation.x = Math.PI / 2; hs.position.set(cx + ox * w, cy + oy * w, z - 0.007 * w); hs.castShadow = true; g.add(hs);
      PH_lens(g, cx + ox * w, cy + oy * w, z - 0.014 * w, r * 0.78, M.ti, M);
    }
    for (const [ox, oy, m] of [[-0.09, 0.12, M.flash], [-0.09, -0.12, M.black]]) {
      const c = new T.Mesh(new T.CircleGeometry(0.022 * w, 24), m); c.position.set(cx + ox * w, cy + oy * w, z - 0.0005); c.rotation.y = Math.PI; g.add(c);
    }
  } else {     // Pixel camera bar across the back
    const y = D.h / 2 - 0.30 * w;
    const visor = K.box(w * 0.985, 0.19 * w, 0.032 * w, { radius: 0.012 * w, material: M.alu }); visor.position.set(0, y, bz - 0.01 * w); g.add(visor);
    const pill = K.slab(0.70 * w, 0.125 * w, { depth: 0.01 * w, radius: 0.0625 * w, material: M.glass });
    pill.position.set(0, y, bz - 0.026 * w - 0.003 * w); g.add(pill);
    const z = pill.position.z - 0.005 * w;
    for (const lx of [0.21, 0.06]) PH_lens(g, lx * w, y, z, 0.046 * w, M.alu, M);
    const fl = new T.Mesh(new T.CircleGeometry(0.018 * w, 24), M.flash); fl.position.set(-0.22 * w, y, z - 0.0005); fl.rotation.y = Math.PI; g.add(fl);
  }
  return g;
}
function PH_front(K, kind, D, M, scr) {   // front glass + screen + punch-hole / island (group centred on the glass)
  const T = PH_3, g = new T.Group();
  const glass = K.slab(D.gw, D.gh, { depth: D.gd, radius: D.gr, material: M.glass }); g.add(glass);
  const screen = new T.Mesh(PH_rrGeo(D.sw, D.sh, D.sr), scr); screen.position.z = D.gd / 2 + 0.0008; g.add(screen);

  } else {

    const rim = new T.Mesh(new T.RingGeometry(0.021 * D.w, 0.025 * D.w, 32), M.holeRim); rim.position.copy(ph.position); g.add(rim);

}

// ---------------------------------------------------------------- screen canvases
function PH_status(g, W, col, k) {
  g.save(); g.fillStyle = col; g.strokeStyle = col; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.font = PH_F(600, 25 * k); g.fillText('9:41', 38 * k, 33 * k);
  const bx = W - 82 * k, by = 23 * k;
  g.lineWidth = 2.2 * k; PH_rr(g, bx, by, 40 * k, 20 * k, 6 * k); g.stroke();
  PH_rr(g, bx + 42.5 * k, by + 6.5 * k, 3 * k, 7 * k, 1.5 * k); g.fill();
  PH_rr(g, bx + 4 * k, by + 4 * k, 26 * k, 12 * k, 3 * k); g.fill();
  const wx = bx - 26 * k, wy = by + 19 * k; g.lineCap = 'round'; g.lineWidth = 3 * k;
  for (let i = 1; i < 3; i++) { g.beginPath(); g.arc(wx, wy, i * 7 * k, -Math.PI * 0.76, -Math.PI * 0.24); g.stroke(); }
  g.beginPath(); g.arc(wx, wy - 1 * k, 2.6 * k, 0, Math.PI * 2); g.fill();
  const sx = wx - 52 * k;
  for (let i = 0; i < 4; i++) { const hh = (6 + i * 4) * k; PH_rr(g, sx + i * 8 * k, by + 19 * k - hh, 5 * k, hh, 1.5 * k); g.fill(); }
  g.restore();
}
function PH_navIcon(g, i, x, y, k, col) {

  if (i === 0) { g.moveTo(x - 13 * k, y - 1 * k); g.lineTo(x, y - 13 * k); g.lineTo(x + 13 * k, y - 1 * k);
    g.moveTo(x - 9 * k, y - 4 * k); g.lineTo(x - 9 * k, y + 12 * k); g.lineTo(x + 9 * k, y + 12 * k); g.lineTo(x + 9 * k, y - 4 * k); }
  else if (i === 1) { g.roundRect(x - 12 * k, y - 10 * k, 24 * k, 22 * k, 4 * k); g.moveTo(x - 12 * k, y - 3 * k); g.lineTo(x + 12 * k, y - 3 * k); }
  else if (i === 2) { for (const [dx, hh] of [[-9, 10], [0, 20], [9, 14]]) { g.moveTo(x + dx * k, y + 11 * k); g.lineTo(x + dx * k, y + (11 - hh) * k); } }
  else { g.arc(x, y - 5 * k, 6.5 * k, 0, Math.PI * 2); g.moveTo(x + 12 * k * Math.cos(Math.PI * 1.15), y + 14 * k + 12 * k * Math.sin(Math.PI * 1.15));
    g.arc(x, y + 14 * k, 12 * k, Math.PI * 1.15, Math.PI * 1.85); }
  g.stroke();
}
function PH_drawHome(g, W, H) {   // generic dark Material-style app UI (not a real app)
  const k = W / 576, G = '#3DDC84';
  g.fillStyle = '#0A0E0C'; g.fillRect(0, 0, W, H);
  let gr = g.createRadialGradient(W * 0.15, -H * 0.05, 0, W * 0.15, -H * 0.05, W * 1.2);
  gr.addColorStop(0, 'rgba(61,220,132,0.20)'); gr.addColorStop(1, 'rgba(61,220,132,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  PH_status(g, W, '#E8EAED', k);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#9AA0A6'; g.font = PH_F(500, 26 * k); g.fillText('Good evening', 36 * k, 132 * k);
  g.fillStyle = '#F5F5F7'; g.font = PH_F(700, 58 * k); g.fillText('Today', 34 * k, 196 * k);
  gr = g.createLinearGradient(W - 106 * k, 130 * k, W - 38 * k, 198 * k); gr.addColorStop(0, '#3DDC84'); gr.addColorStop(1, '#1B8F57');
  g.fillStyle = gr; g.beginPath(); g.arc(W - 72 * k, 164 * k, 34 * k, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#05240F'; g.beginPath(); g.arc(W - 72 * k, 155 * k, 11 * k, 0, Math.PI * 2); g.fill();

    const halo = nvSprite(col, 2.6, 0.12, nvcB(sx * 1.75, 1.13, -0.45)); B.add(halo);
    const anchor = new THREE.Object3D(); anchor.position.set(...nvcB(sx * 1.75, 0.98 - 0.75 - 0.08, 0.2)); B.add(anchor);
    const pts = [nvcB(sx * 0.4, 1.9, -0.15), nvcB(sx * 0.95, 2.22, 0.0), nvcB(sx * 1.45, 2.0, 0.12), nvcB(sx * 1.75, 1.77, 0.2)];
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 0.006, 8, false), K.mat.glow(0xdfe8ff, { intensity: 1.25 }));
    B.add(tube);
    const pulses = [0, 1].map(() => { const p = nvSprite(0xeaf2ff, 0.16, 0.85); B.add(p); return p; });
    return { grp, mat, halo, anchor, curve, tube, n: tube.geometry.index.count, pulses, base: grp.position.clone(), sx };
  });
  const dG = 5.6, wG = 600 / nvPxPerUnit(s, dG);
  const cardG = nvcCard(1000, 300, wG, rad => nvcGPayCard(rad));
  { const c = CAM(23.0); cardG.position.copy(nvAt(s, c, 960, 868, dG)); cardG.lookAt(c[0], c[1], c[2]); }
  B.add(cardG);
  const cardGBase = { p: cardG.position.clone(), rx: cardG.rotation.x };
  const cubeAnchor = new THREE.Object3D(); cubeAnchor.position.copy(cubePos).add(new THREE.Vector3(0, -0.6, 0)); B.add(cubeAnchor);

  // ---------------- HTML
  const $ = id => document.getElementById(id);
  const h1 = $('nv-h1'), h2e = $('nv-h2e'), h2t = $('nv-h2t'), lk = $('nv-lk'), ls = $('nv-ls'), la = $('nv-la'), li = $('nv-li'),
    lf = $('nv-lf'), fade = $('nv-fade');
  for (const el of [lk, ls, la, li, lf]) el.dataset.base = 'translate(-50%, 0)';

  const tmpV = new THREE.Vector3(), flCol = new THREE.Color(NV_C.flutter), coolCol = new THREE.Color(0xdfe8ff);
  K.run(s, t => {
    // camera: one path + exit dolly into the cube
    const c = CAM(t), kx = NV_CL((t - 24.98) / 0.55), push = 5.0 * kx * kx;
    if (push > 0) {
      tmpV.copy(cubePos).sub(new THREE.Vector3(c[0], c[1], c[2])).normalize();
      c[0] += tmpV.x * push; c[1] += tmpV.y * push; c[2] += tmpV.z * push;
    }
    nvApplyCam(s, c);
    W.update(t);

    // ACT 1
    A.visible = t < 15.8;
    const out1 = 1 - P(t, 12.15, 0.6, K.ease.inOut);
    phoneA.rotation.set(-0.03, -0.42 + 0.052 * t, 0);
    phoneA.position.y = 1.3 + 0.022 * Math.sin(0.7 * t);
    scrA.uniforms.uGain.value = 0.94 * P(t, 0.9, 0.8, K.ease.inOut);
    scrA.uniforms.uMix.value = P(t, 9.55, 0.7, K.ease.inOut);
    const g1 = P(t, 2.2, 1.0, K.ease.inOut) * (1 - P(t, 13.0, 1.5, K.ease.inOut));
    greenA.intensity = 9 * g1; haloA.material.opacity = 0.15 * g1; poolA.material.opacity = 0.09 * g1;
    for (const T of tiles) {
      const k = NV_CL((t - T.t0) / 1.15), u = K.ease.inOut(k), v = 1 - u;
      T.tl.position.set(0, 0, 0).addScaledVector(T.p0, v * v).addScaledVector(T.pc, 2 * u * v).addScaledVector(T.p1, u * u);
      T.tl.position.y += 0.022 * Math.sin(0.9 * t + T.t0) * u;
      T.tl.rotation.y = T.ry + (1 - u) * 1.8;
      nvFade(T.tl, NV_CL(k * 2.5) * out1);
    }
    const kS = P(t, 9.55, 1.15);
    cardS.position.copy(cardSBase.p).add(tmpV.set(-0.45 * (1 - kS), -0.12 * (1 - kS), -0.5 * (1 - kS)));
    cardS.position.y += 0.015 * Math.sin(0.8 * t) * kS;
    cardS.rotation.y = cardSBase.ry + 0.35 * (1 - kS);
    nvFade(cardS, kS * out1);

    // ACT 2
    const kc = P(t, 13.7, 1.4, K.ease.inOut), fl = P(t, 24.2, 0.6, K.ease.inOut);
    cube.position.copy(cubePos); cube.position.y += -0.45 * (1 - kc) + 0.02 * Math.sin(0.8 * t);
    cube.scale.setScalar(0.8 + 0.2 * kc);
    cube.rotation.set(0.1, -0.25 + 0.2 * (t - 24.6), 0);
    nvFade(cube, kc);
    for (const f of faces) f.material.opacity = 0.85 * kc * (f === faces[0] ? 1 - 0.75 * fl : 1);
    flDec.material.opacity = fl; flDec.visible = fl > 0.002;
    const lit = P(t, 14.5, 1.0, K.ease.inOut);
    cubeLight.intensity = 5 * lit; cubeLight.color.copy(coolCol).lerp(flCol, fl);
    cubeHalo.material.opacity = 0.2 * lit + 0.08 * fl; cubeHalo.material.color.copy(coolCol).lerp(flCol, fl);
    cubePool.material.opacity = 0.08 * lit; cubePool.material.color.copy(coolCol).lerp(flCol, fl);
    for (const [i, Ph] of phones.entries()) {
      const k = P(t, 16.95 + i * 0.15, 1.0, K.ease.inOut);
      Ph.grp.position.copy(Ph.base); Ph.grp.position.y += -0.35 * (1 - k) + 0.02 * Math.sin(0.75 * t + i * 1.7);
      Ph.grp.scale.setScalar(0.94 + 0.06 * k);
      nvFade(Ph.grp, k);
      Ph.halo.material.opacity = 0.12 * k;
      const ks = P(t, 17.05 + i * 0.1, 0.8, K.ease.inOut);
      Ph.tube.visible = ks > 0.002;
      Ph.tube.geometry.setDrawRange(0, Math.floor(Ph.n * ks / 6) * 6);
      Ph.mat.uniforms.uGain.value = 0.94 * P(t, 17.6 + i * 0.1, 0.5, K.ease.inOut);
      Ph.mat.uniforms.uMix.value = P(t, 21.85 + i * 0.12, 0.7, K.ease.inOut);
      for (const [j, p] of Ph.pulses.entries()) {
        const u = (((t - 18.0) / 1.6 + j * 0.5) % 1 + 1) % 1;
        p.position.copy(Ph.curve.getPointAt(u));
        p.material.opacity = t > 18.0 ? 0.85 * Math.sin(Math.PI * u) : 0;
        p.visible = t > 18.0;
      }
    }
    const kG = P(t, 21.75, 1.15);
    cardG.position.copy(cardGBase.p).add(tmpV.set(0, -0.28 * (1 - kG), -0.4 * (1 - kG)));
    cardG.position.y += 0.012 * Math.sin(0.8 * t + 1) * kG;
    cardG.rotation.x = cardGBase.rx + 0.25 * (1 - kG);
    nvFade(cardG, kG);
    B.visible = t > 13.5;

    // HTML
    const outE = 1 - P(t, 25.12, 0.33, K.ease.inOut);
    nvShow(h1, P(t, 2.25, 0.75) * out1);
    K.pin(lk, tileK, s, { offset: [0, -0.42, 0] }); nvShow(lk, P(t, 5.75, 0.6) * out1, 10);
    K.pin(ls, tileS, s, { offset: [0, -0.42, 0] }); nvShow(ls, P(t, 7.65, 0.6) * out1, 10);
    nvShow(h2e, P(t, 13.9, 0.6) * outE); nvShow(h2t, P(t, 15.0, 0.7) * outE);
    K.pin(la, phones[0].anchor, s); nvShow(la, P(t, 17.45, 0.6) * outE, 10);
    K.pin(li, phones[1].anchor, s); nvShow(li, P(t, 17.6, 0.6) * outE, 10);
    K.pin(lf, cubeAnchor, s); nvShow(lf, P(t, 24.3, 0.55) * outE, 10);
    fade.style.opacity = (0.9 * P(t, 25.2, 0.33, K.ease.linear)).toFixed(3);
  });
}

window.renderReady = nvcMain();
</script>
