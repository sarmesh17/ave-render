name: render
on:
  push:
    branches: ['job-*']
jobs:
  render:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        m: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: >-
          (curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          | tar xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' && ffmpeg -version | head -1)
          || (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg > /dev/null)
      - name: playwright
        run: python3 -c "import playwright" || pip install -q --break-system-packages playwright==1.62.0
      - name: render
        run: python3 run_jobs.py ${{ matrix.m }} 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-${{ matrix.m }}
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
